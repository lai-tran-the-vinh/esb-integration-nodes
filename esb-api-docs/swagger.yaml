openapi: 3.0.1
info:
  title: Tài liệu tích hợp
  description: Trục liên thông dữ liệu phục vụ chia sẻ dữ liệu đa cấu trúc.
  version: 1.0.0
servers:
  - url: "http://localhost:8290/api/v1"
    description: Môi trường Local Gateway
tags:
  - name: Sản phẩm
    description: Các API liên quan đến truy xuất danh mục hàng hóa từ ERP.
  - name: Đơn hàng
    description: Khởi tạo và điều phối đơn hàng đa hệ thống.
  - name: Hóa đơn
    description: Truy xuất và hiển thị dữ liệu hóa đơn điện tử.
  - name: Thanh toán VNPay
    description: Tích hợp ví điện tử, xử lý webhook và redirect.

paths:
  /products:
    get:
      tags:
        - Sản phẩm
      summary: Lấy danh sách sản phẩm chuẩn hóa
      description: Truy xuất danh sách sản phẩm từ Dolibarr, gọt bỏ các trường dư thừa và chuẩn hóa cấu trúc hình ảnh.
      responses:
        '200':
          description: Danh sách sản phẩm thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

  /orders:
    post:
      tags:
        - Đơn hàng
      summary: Khởi tạo đơn hàng đồng bộ (ERP & InvoiceShelf)
      description: API nhận yêu cầu từ Frontend, xác thực Keycloak, kiểm tra khách hàng, tạo đơn trong Dolibarr, xuất hóa đơn ở InvoiceShelf và cuối cùng trả về link thanh toán VNPay.
      security:
        - KeycloakAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '200':
          description: Tạo đơn hàng và link thanh toán thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSuccessResponse'
        '401':
          description: Lỗi xác thực Keycloak Token
        '500':
          description: Lỗi từ hệ thống lõi ERP hoặc ESB

  /orders/track:
    post:
      tags:
        - Đơn hàng
      summary: Tra cứu trạng thái đơn hàng
      description: Kiểm tra trạng thái thanh toán của đơn hàng qua ID và xác thực bằng Email. Trả về thông tin đơn, trạng thái thanh toán, link thanh toán (nếu chưa thanh toán) và số hóa đơn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackOrderRequest'
      responses:
        '200':
          description: Tra cứu thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackOrderResponse'
        '400':
          description: Dữ liệu đầu vào không hợp lệ (VD vắng tham số, email sai chuẩn RFC 5322).
        '403':
          description: Email tra cứu không khớp với thông tin người đặt hàng gốc.
        '404':
          description: Mã đơn hàng không tồn tại trên hệ thống.
        '500':
          description: Lỗi máy chủ nội bộ.

  /invoices/{orderId}:
    get:
      tags:
        - Hóa đơn
      summary: Xem chi tiết hóa đơn
      description: Dựa trên mã đơn hàng ERP (orderId), đối soát để lấy mã hóa đơn tương ứng, sau đó truy vấn thông tin chi tiết và link PDF từ hệ thống InvoiceShelf.
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
          description: ID đơn hàng trên hệ thống Dolibarr ERP
      responses:
        '200':
          description: Lấy chi tiết hóa đơn thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetailResponse'
        '404':
          description: Đơn hàng không tồn tại hoặc hóa đơn chưa được khởi tạo.
        '500':
          description: Lỗi hệ thống nội bộ nghiêm trọng.
        '503':
          description: Dịch vụ hóa đơn InvoiceShelf đang tạm ngắt kết nối.

  /payments/vnpay:
    post:
      tags:
        - Thanh toán VNPay
      summary: Sinh URL thanh toán VNPay (Nội bộ)
      description: API mã hóa HMAC-SHA512 để sinh URL an toàn gửi sang cổng VNPay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VNPayRequest'
      responses:
        '200':
          description: Trả về URL thanh toán thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  payUrl:
                    type: string
                    format: uri
                    description: "Đường dẫn thanh toán VNPay chuẩn URL (tuân thủ chuẩn RFC 3986)"
                    example: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html?..."

  /vnpay/return:
    get:
      tags:
        - Thanh toán VNPay
      summary: Xử lý Redirect từ VNPay
      description: Nhận request trả về từ trình duyệt khách hàng sau khi thanh toán, điều hướng (302) về lại trang Frontend của hệ thống.
      parameters:
        - in: query
          name: vnp_TxnRef
          schema:
            type: string
          required: true
          description: Mã đơn hàng (Mã giao dịch)
        - in: query
          name: vnp_ResponseCode
          schema:
            type: string
          required: true
          description: Mã trạng thái thanh toán từ VNPay
      responses:
        '302':
          description: Redirect về trang Frontend báo kết quả.

  /webhook/vnpay:
    get:
      tags:
        - Thanh toán VNPay
      summary: VNPay IPN Webhook (Cập nhật trạng thái ngầm)
      description: Lắng nghe tín hiệu ngầm từ VNPay (Server-to-Server) để tự động Validate đơn hàng trên ERP Dolibarr và kích hoạt trừ tồn kho.
      parameters:
        - in: query
          name: vnp_TxnRef
          schema:
            type: string
          required: true
        - in: query
          name: vnp_ResponseCode
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Đã xác nhận trạng thái thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  RspCode:
                    type: string
                    example: "00"
                  Message:
                    type: string
                    example: "Confirm Success"

components:
  securitySchemes:
    KeycloakAuth:
      type: oauth2
      description: |
        **Quy trình lấy Token dành cho Đối tác (Server-to-Server):**
        
        **Bước 1: Gọi API xin cấp Token**
        Gửi một request `POST` đến URL cấp Token bên dưới với các tiêu chuẩn sau:
        * **Header:** Bắt buộc phải có `Content-Type: application/x-www-form-urlencoded`.
        * **Body (Form-data):** Truyền vào 3 thông số:
          1. `grant_type`: Bắt buộc điền là `client_credentials`
          2. `client_id`: (Mã định danh đối tác được cấp)
          3. `client_secret`: (Mã bí mật được cấp)
          
        **Bước 2: Gắn Token vào API nghiệp vụ**
        Hệ thống sẽ trả về một `access_token` (định dạng JWT). 
        Đối tác mang token này gắn vào **Header** của các lệnh gọi API tiếp theo theo cú pháp:
        `Authorization: Bearer <mã_access_token>`
      flows:
        clientCredentials:
          tokenUrl: "http://localhost:8080/realms/WSO2-Realm/protocol/openid-connect/token"
          scopes: {}

  schemas:
    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        ref:
          type: string
          example: "SP001"
        name:
          type: string
          example: "Áo thun basic"
        price:
          type: number
          format: float
          description: "Đơn giá sản phẩm (tuân thủ chuẩn IEEE 754)"
          example: 150000
        description:
          type: string
          example: "Áo thun cotton 100%"
        stock:
          type: integer
          example: 100
        img:
          type: string
          format: uri
          description: "Đường dẫn URL hình ảnh (tuân thủ chuẩn RFC 3986)"
          example: "https://images.unsplash.com/photo-12345"

    OrderRequest:
      type: object
      properties:
        customer_name:
          type: string
          example: "Nguyễn Văn A"
        customer_email:
          type: string
          format: email
          description: "Địa chỉ thư điện tử khách hàng (tuân thủ chuẩn RFC 5322)"
          example: "nva@gmail.com"
        amount:
          type: number
          format: float
          description: "Tổng tiền đơn hàng (tuân thủ chuẩn IEEE 754)"
          example: 150000
        products:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: integer
                example: 1
              quantity:
                type: integer
                example: 2

    OrderSuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        message:
          type: string
          example: "Đã tạo đơn hàng và link thanh toán thành công."
        dolibarr_order_id:
          type: string
          example: "45"
        payment_url:
          type: string
          format: uri
          description: "Đường dẫn thanh toán VNPay chuẩn URL (tuân thủ chuẩn RFC 3986)"
          example: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html?..."

    VNPayRequest:
      type: object
      properties:
        orderId:
          type: string
          example: "45"
        amount:
          type: number
          format: float
          description: "Số tiền cần thanh toán (tuân thủ chuẩn IEEE 754)"
          example: 150000
        orderInfo:
          type: string
          example: "Thanh toan don hang 45"
        redirectUrl:
          type: string
          format: uri
          description: "URL điều hướng sau thanh toán (tuân thủ chuẩn RFC 3986)"
          example: "http://localhost:8290/api/v1/vnpay/return"
          
    TrackOrderRequest:
      type: object
      required:
        - order_id
        - email
      properties:
        order_id:
          type: string
          description: "Mã định danh đơn hàng trên hệ thống"
          example: "45"
        email:
          type: string
          format: email
          description: "Email xác thực để bảo mật thông tin truy xuất"
          example: "nva@gmail.com"

    TrackOrderResponse:
      type: object
      properties:
        status:
          type: string
          example: "success"
        order:
          type: object
          properties:
            id:
              type: string
              example: "45"
            ref:
              type: string
              example: "CO2408-0001"
            date:
              type: string
              description: "Ngày tạo đơn dạng Unix Timestamp"
              example: "1719543200"
            total:
              type: string
              description: "Tổng tiền dạng số nguyên"
              example: "150000"
            status_label:
              type: string
              example: "Chưa thanh toán"
            lines:
              type: array
              description: "Danh sách sản phẩm trong đơn"
              items:
                type: object
        actions:
          type: object
          properties:
            can_pay:
              type: boolean
              description: "Cờ cho phép tiếp tục thanh toán"
              example: true
            pay_url:
              type: string
              format: uri
              description: "Link thanh toán (trống nếu đã thanh toán)"
              example: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html?..."
            invoice_number:
              type: string
              description: "Số hóa đơn điện tử (trống nếu chưa thanh toán)"
              example: ""

    InvoiceDetailResponse:
      type: object
      properties:
        id:
          type: integer
          description: "ID Hóa đơn trên InvoiceShelf"
          example: 21
        invoice_number:
          type: string
          description: "Số hiệu hóa đơn đối soát"
          example: "INV-DL-45"
        sub_total_display:
          type: string
          description: "Tiền hàng hiển thị chuẩn VNĐ"
          example: "150.000 đ"
        total_display:
          type: string
          description: "Tổng thanh toán hiển thị chuẩn VNĐ"
          example: "150.000 đ"
        invoice_pdf_url:
          type: string
          format: uri
          description: "Đường dẫn tải file PDF hóa đơn đã được mapping cổng mạng"
          example: "http://localhost:8002/invoices/pdf/xxxxxx"